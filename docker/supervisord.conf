[unix_http_server]
file=/tmp/mihomo-manager-supervisor.sock
chmod=0700
[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/mihomo-manager-supervisor.pid
user=root
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///tmp/mihomo-manager-supervisor.sock
[eventlistener:fatal-exit]
command=python3 /etc/mihomo-manager/fatal_exit.py
events=PROCESS_STATE_FATAL
priority=1
buffer_size=10
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:mihomo]
command=/usr/local/bin/mihomo -d %(ENV_DATA_DIR)s -f %(ENV_DATA_DIR)s/config.yaml
priority=10
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
[program:manager]
command=/usr/local/bin/mihomo-manager
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
