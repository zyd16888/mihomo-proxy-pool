services:
  mihomo-manager:
    image: ${MIHOMO_IMAGE:?请在 .env 中设置已发布的 GHCR 镜像地址}
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 75s
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?请在 .env 中设置至少 12 字符的 ADMIN_KEY}
      TZ: ${TZ:-Asia/Shanghai}
      CONTROL_ADDR: 0.0.0.0:3481
      MIHOMO_CONTROL_ADDR: 127.0.0.1:9090
      # 出口 IP 探测使用的回环端口。与宿主机已有服务冲突时改这里，0 关闭按节点探测。
      EXIT_PROBE_PORT: ${EXIT_PROBE_PORT:-37891}
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
